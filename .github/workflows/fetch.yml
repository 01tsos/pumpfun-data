name: Fetch pump.fun launches

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests solders base58 urllib3
      - name: Run fetch script
        run: python scripts/fetch.py
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/launches.csv ]; then
            git add data/launches.csv
            git commit -m "Auto-update launches $(date)" || true
            git push
          else
            echo "No launches.csv to commit"
          fi
        shell: bash
