name: Fetch pump.fun launches

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pumpfun-collector
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests base58
      - env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MAX_SIGNATURE_PAGES: "5"
          REQUEST_DELAY: "0.02"
        run: python -u scripts/fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/launches.csv ] && git add data/launches.csv
          [ -f data/collector_state.json ] && git add data/collector_state.json
          git diff --cached --quiet || git commit -m "Update pump.fun launch data"
          git pull --rebase origin main
          git push
