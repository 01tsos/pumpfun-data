name: Fetch pump.fun launches

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pumpfun-collector
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 base58==2.1.1

      - name: Collect launches
        env:
          RPC_URLS: ${{ secrets.RPC_URLS }}
          RPC_URL: ${{ secrets.RPC_URL }}
          MAX_SIGNATURE_PAGES: "5"
          REQUEST_DELAY: "0.12"
        run: python -u scripts/fetch.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/launches.csv data/collector_state.json
          git diff --cached --quiet || git commit -m "Update pump.fun launch data"
          git push
